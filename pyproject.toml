[project]
name = "uniswap-lp-economics"
version = "1.0.0"
authors = [{ name = "Enrico Nagata" }]
license = "MIT"
license-files = ["LICENSE"]
description = "Who makes money on Uniswap V3? Price discovery, flow markouts and arbitrage profit on USDC/WETH 0.05% vs Binance."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "google-cloud-bigquery>=3.46.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pycryptodome>=3.24.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
ulpe = "uniswap_lp_economics.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network access and credentials (run with -m live)"]
addopts = "-m 'not live'"
